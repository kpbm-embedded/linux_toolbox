# Board definition for scripts/kbuild. Copy this folder to boards/<board>/ and fill it in.
ARCH=arm64                          # kernel ARCH (arm, arm64, riscv, x86_64, …)
CROSS_COMPILE=aarch64-none-linux-gnu-   # prefix of a compiler in ../../toolchain/*/bin
KERNEL_TREE=linux-stable            # folder in ../../upstream/
KERNEL_REF=v6.18                    # tag or branch the board is pinned to (recorded in the build log)
DEFCONFIG=defconfig                 # base config from the tree (arch/$ARCH/configs/…); may list several targets
MAKE_ARGS=""                        # optional extra make variables, e.g. "FOO=bar BAZ=qux"
FRAGMENTS="kernel.fragment"         # extra config fragments in this folder, merged in order
DTBS=""                             # device trees to build, e.g. "rockchip/rk3568-evb1-v10.dtb"
