# Allwinner A733 (sun60iw2, 2x A76 + 6x A55 + RISC-V E907): Radxa Cubie A7Z. No A733 support in mainline (v7.3).
# Radxa's BSP: kernel 5.15 + out-of-tree bsp/ + device-a733 configs, pinned by radxa-pkg/linux-a733; run scripts/a733-assemble once.
ARCH=arm64
CROSS_COMPILE=aarch64-linux-        # toolchain/gcc-14.3.0-aarch64-linux (kernel.org crosstool)
KERNEL_TREE=linux-a733/src          # github.com/radxa/kernel allwinner-aiot-linux-5.15 (5.15.147)
KERNEL_REF="packaging@166c84e4 src@e4149989 bsp@2045a3ca device@6d911d15"
DEFCONFIG="defconfig radxa.config radxa_custom.config"   # defconfig = bsp.config (device-a733 bsp_defconfig) via KBUILD_DEFCONFIG
MAKE_ARGS="KBUILD_DEFCONFIG=bsp.config BSP_TOP=$KLINUX_UPSTREAM/linux-a733/src/bsp/ LICHEE_KERN_DIR=$KLINUX_UPSTREAM/linux-a733/src"
FRAGMENTS="kernel.fragment"
DTBS="allwinner/sun60i-a733-cubie-a7z.dtb allwinner/sun60i-a733-cubie-a7a.dtb allwinner/sun60i-a733-cubie-a7s.dtb"
