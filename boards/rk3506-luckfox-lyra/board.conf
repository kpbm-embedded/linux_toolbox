# Rockchip RK3506 (3x Cortex-A7 + Cortex-M0): Luckfox Lyra (B, RK3506G2) and EBYTE ECK41. No RK3506 DT in mainline (v7.3 has
# only the clk/reset/pinctrl drivers), so this is Rockchip's BSP kernel plus the Luckfox board DTs (local commit, see notes.md).
ARCH=arm
CROSS_COMPILE=arm-linux-gnueabi-    # toolchain/gcc-14.3.0-arm-linux-gnueabi (kernel.org crosstool)
KERNEL_TREE=rockchip-linux-kernel   # github.com/rockchip-linux/kernel develop-6.1 (6.1.172), branch box/luckfox-lyra
KERNEL_REF="box/luckfox-lyra@6dc4ec06 (develop-6.1@77168c8d)"
DEFCONFIG=rk3506_luckfox_defconfig
FRAGMENTS="kernel.fragment"
# Lyra boots from SPI NAND (UBI) or, with the -sd DTs, from the SD card; evb1 is the closest Rockchip DT for the ECK41 (no public ECK41 DT)
DTBS="rk3506g-luckfox-lyra.dtb rk3506g-luckfox-lyra-sd.dtb rk3506g-luckfox-lyra-plus.dtb rk3506g-luckfox-lyra-plus-sd.dtb rk3506g-evb1-v10.dtb"
