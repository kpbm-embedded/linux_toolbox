# @NAME@: <SoC, board, RAM>. Why this tree (mainline / LTS / vendor) and what works (see notes.md).
ARCH=arm64                          # kernel ARCH: arm, arm64, riscv
CROSS_COMPILE=aarch64-linux-        # toolchain/*/bin prefix: riscv64-linux-, aarch64-linux-, arm-linux-gnueabi-
KERNEL_TREE=linux-6.18.58           # folder in upstream/ (klinux setup; see sources.lock)
KERNEL_REF=v6.18.58                 # tag or commit, recorded in the build log
DEFCONFIG=defconfig                 # arch/$ARCH/configs/... ; may list several targets
MAKE_ARGS=""                        # extra make variables
FRAGMENTS="kernel.fragment"         # merged in order over DEFCONFIG
DTBS=""                             # e.g. "rockchip/rk3568-evb1-v10.dtb" (empty: all dtbs)
