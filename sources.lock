# Pinned sources for `klinux setup` (and `klinux update --check`). One entry per line, fields separated by spaces.
#
# toolchain <folder in toolchain/> <url> <sha256>      kernel.org crosstool (no libc); the tarball is cached in cache/downloads/
# stable <worktree in upstream/> <tag> <commit>        worktree of upstream/linux-stable.git (bare, shallow)
# git <folder in upstream/> <url> <commit> <branch>    shallow fetch of exactly <commit>; <branch> is only for update --check
# post <folder in upstream/> <script in scripts/>      run once after the fetch (local changes on top of a tree)
