# Canaan CanMV-K230, mainline kernel. Upstream K230 support starts in v7.3 (none in the 6.18/6.12 LTS):
# clocks, pinctrl, reset and UART in the DT (a USB PHY driver exists, no DT node yet); no SD/MMC or Ethernet,
# so it boots to an initramfs on the serial console. The DT declares 512MB of RAM.
ARCH=riscv
CROSS_COMPILE=riscv64-linux-        # toolchain/gcc-14.3.0-riscv64-linux (kernel.org crosstool)
KERNEL_TREE=linux-7.3               # worktree of upstream/linux-stable.git
KERNEL_REF=v7.3
DEFCONFIG=defconfig
FRAGMENTS="kernel.fragment"
DTBS="canaan/k230-canmv.dtb canaan/k230-evb.dtb"   # no BPI-CanMV-K230D-Zero DT upstream yet
