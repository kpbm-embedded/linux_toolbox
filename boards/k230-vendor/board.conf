# Canaan K230 / K230D boards, vendor kernel (full drivers: SD, Ethernet, USB, display, camera).
# Same tree, commit and defconfig as kendryte/k230_linux_sdk (buildroot-overlay/configs/k230_canmv_defconfig).
ARCH=riscv
CROSS_COMPILE=riscv64-linux-        # toolchain/gcc-14.3.0-riscv64-linux (kernel.org crosstool)
KERNEL_TREE=linux-xuantie-kernel    # github.com/ruyisdk/linux-xuantie-kernel, Linux 6.6.36
KERNEL_REF=ae4a7e6518cd46407be9b648828b6f704d7dc302
DEFCONFIG=k230_defconfig
FRAGMENTS="kernel.fragment"
# CanMV-K230 (1GB) and Banana Pi BPI-CanMV-K230D-Zero (128MB); the other vendor K230 DTs build too
DTBS="canaan/k230-canmv.dtb canaan/bananapi-canmv-k230d-zero.dtb canaan/k230-canmv-01studio.dtb canaan/k230d-canmv.dtb canaan/k230-evb.dtb"
