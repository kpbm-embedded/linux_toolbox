# Example board: QEMU "virt" machine, riscv64, on the 6.18 LTS tree. No hardware needed, so it is the
# reference board for trying kbuild and the examples/ (copy boards/_template for a real board).
# QEMU's virt machine generates its own DT at boot, so there are no DTBS to build.
ARCH=riscv
CROSS_COMPILE=riscv64-linux-        # toolchain/gcc-14.3.0-riscv64-linux (kernel.org crosstool)
KERNEL_TREE=linux-6.18.58           # worktree of upstream/linux-stable.git
KERNEL_REF=v6.18.58
DEFCONFIG=defconfig
FRAGMENTS="kernel.fragment"
DTBS=""
